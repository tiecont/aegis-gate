[workspace]

[package]
name = "aegisgate-hyper-feasibility"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
rust-version = "1.99"

[dependencies]
arc-swap = "=1.9.5"
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
hyper-timeout = "=0.5.2"
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "server", "tokio"] }
openssl = "=0.10.82"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = { version = "=1.16.0", features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "signal", "sync"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tower-service = "=0.3.3"
