[workspace]
members = ["edge-server", "config-agent", "policy-engine", "edge-types"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.2", features = ["serde"] }
edge-types = { path = "edge-types" }
policy-engine = { path = "policy-engine" }
